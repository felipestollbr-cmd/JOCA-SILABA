name: Testes do Joca

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes da API
        run: npm test -- --runInBand
